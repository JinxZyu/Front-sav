<form class="buscador" [formGroup]="formulario()" (ngSubmit)="buscar.emit()" novalidate>
  <div class="barra">
    <div class="campo donde">
      <label class="nombre" for="destino-busqueda">Dónde</label>
      <app-selector-destino
        idEntrada="destino-busqueda"
        [control]="ciudad()"
        [destinos]="destinos()"
      />
    </div>
    <label class="campo">
      <span class="nombre">Llegada</span>
      <input type="date" formControlName="llegada" [min]="minimo" />
    </label>
    <label class="campo">
      <span class="nombre">Salida</span>
      <input
        type="date"
        formControlName="salida"
        [min]="formulario().controls['llegada'].value || minimo"
        [attr.aria-invalid]="formulario().hasError('rango')"
        [attr.aria-describedby]="formulario().hasError('rango') ? 'error-fechas' : null"
      />
    </label>
    <label class="campo">
      <span class="nombre">Huéspedes</span>
      <input
        type="number"
        formControlName="huespedes"
        placeholder="¿Cuántos?"
        min="1"
        step="1"
        inputmode="numeric"
        [attr.aria-invalid]="formulario().controls['huespedes'].invalid"
      />
    </label>
    <button type="submit" class="lupa" aria-label="Buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <span class="texto-lupa">Buscar</span>
    </button>
  </div>
  @if (formulario().hasError('rango')) {
    <p class="error-campo" id="error-fechas">La salida debe ser posterior a la llegada.</p>
  }

  <div class="opciones">
    <button
      type="button"
      class="alternar"
      [attr.aria-expanded]="avanzada()"
      aria-controls="busqueda-avanzada"
      (click)="avanzada.set(!avanzada())"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" />
        <circle cx="16" cy="6" r="2" />
        <circle cx="10" cy="12" r="2" />
        <circle cx="18" cy="18" r="2" />
      </svg>
      Búsqueda avanzada
      @if (filtrosAvanzados() > 0) {
        <span class="contador">{{ filtrosAvanzados() }}</span>
      }
    </button>
    @if (mostrarLimpiar()) {
      <button type="button" class="enlace limpiar" (click)="limpiar.emit()">Limpiar filtros</button>
    }
  </div>
</form>
