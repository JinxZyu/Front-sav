<form
  class="avanzada"
  id="busqueda-avanzada"
  [formGroup]="formulario()"
  (ngSubmit)="aplicar.emit()"
  (keydown.escape)="cerrar.emit()"
  novalidate
>
  <label>
    Tipo
    <select formControlName="tipo">
      <option value="">Cualquiera</option>
      @for (tipo of tipos; track tipo) {
        <option [value]="tipo">{{ tipo }}</option>
      }
    </select>
  </label>
  <label>
    Precio mínimo (COP)
    <input type="number" formControlName="precioMinimo" min="0" step="1" inputmode="numeric" />
  </label>
  <label>
    Precio máximo (COP)
    <input
      type="number"
      formControlName="precioMaximo"
      min="0"
      step="1"
      inputmode="numeric"
      [attr.aria-invalid]="formulario().hasError('precios')"
      [attr.aria-describedby]="formulario().hasError('precios') ? 'error-precios' : null"
    />
    @if (formulario().hasError('precios')) {
      <span class="error-campo" id="error-precios">Debe ser mayor o igual al mínimo.</span>
    }
  </label>
  @if (servicios().status() === 'error') {
    <p class="ancha aviso-servicios" role="alert">
      No pudimos cargar los servicios para filtrar.
      <button type="button" class="enlace" (click)="servicios().reload()">Reintentar</button>
    </p>
  } @else if (servicios().hasValue() && servicios().value()?.length) {
    <fieldset class="ancha servicios">
      <legend>Servicios incluidos</legend>
      @for (servicioDisponible of servicios().value(); track servicioDisponible.idServicio) {
        <label class="servicio" [class.marcado]="marcado(servicioDisponible.idServicio)">
          <input
            type="checkbox"
            [checked]="marcado(servicioDisponible.idServicio)"
            (change)="alternarServicio(servicioDisponible.idServicio)"
          />
          {{ servicioDisponible.nombre }}
        </label>
      }
    </fieldset>
  }
  <div class="ancha acciones">
    <button type="submit" class="principal">Aplicar filtros</button>
  </div>
</form>
