@if (fallo()) {
  <span class="aviso" role="img" [attr.aria-label]="'No se pudo cargar: ' + descripcion()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <circle cx="9" cy="10" r="2" />
      <path d="m21 16-5-5-9 9" />
    </svg>
    Imagen no disponible
  </span>
} @else if (url(); as url) {
  <img [src]="url" [alt]="descripcion()" (error)="falloAlMostrar.set(true)" />
} @else {
  <span class="cargando" role="img" [attr.aria-label]="'Cargando ' + descripcion()"></span>
}
