<header class="encabezado">
  <a routerLink="/" class="marca" aria-label="SAV, ir al inicio">
    <img src="/logo-sav.png" alt="SAV" width="86" height="36" />
  </a>
  <nav>
    @if (sesion.tieneRol('ANFITRION')) {
      <a routerLink="/alojamientos" routerLinkActive="activo">Mis alojamientos</a>
      <a routerLink="/reservas/alojamientos" routerLinkActive="activo" class="opcional">Reservas</a>
    } @else {
      <a routerLink="/publicaciones" routerLinkActive="activo">Alojamientos</a>
    }
    @if (sesion.tieneRol('HUESPED')) {
      <a routerLink="/reservas" routerLinkActive="activo" class="opcional">Mis reservas</a>
    }
    @if (sesion.autenticado()) {
      <app-campana-notificaciones />
      <app-menu-usuario />
    } @else {
      <a routerLink="/usuario/login" routerLinkActive="activo" class="opcional">Iniciar sesión</a>
      <a routerLink="/usuario/registro" class="destacado">Registrarse</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<app-avisos-flotantes />
