<form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
  <label [for]="id + '-tipo'">Tipo de documento</label>
  <select #campo [id]="id + '-tipo'" formControlName="tipoDocumento">
    @for (tipo of tipos; track tipo.valor) {
      <option [value]="tipo.valor">{{ tipo.etiqueta }}</option>
    }
  </select>

  <label [for]="id + '-numero'">Número de documento</label>
  <input
    type="text"
    autocomplete="off"
    [id]="id + '-numero'"
    formControlName="documentoIdentidad"
    [attr.aria-invalid]="invalido()"
    [attr.aria-describedby]="id + '-ayuda'"
  />
  <span class="ayuda" [id]="id + '-ayuda'" [class.error-campo]="invalido()">
    Entre 5 y 20 letras o números, sin espacios ni puntos.
  </span>

  @if (error(); as error) {
    <p class="alerta" role="alert">{{ error }}</p>
  }

  <div class="botones">
    <button type="submit" class="principal" [disabled]="enviando()">
      {{ enviando() ? 'Guardando…' : 'Guardar documento' }}
    </button>
    <button type="button" class="secundario" [disabled]="enviando()" (click)="cancelar.emit()">
      Cancelar
    </button>
  </div>
</form>
