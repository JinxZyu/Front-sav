<div class="pila" role="status" aria-live="polite">
  @for (aviso of servicio.avisos(); track aviso.id) {
    <div class="aviso" [class.error]="aviso.tipo === 'error'" [attr.role]="aviso.tipo === 'error' ? 'alert' : null">
      <span class="icono" aria-hidden="true">
        @if (aviso.tipo === 'error') {
          <svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01" /></svg>
        } @else if (aviso.tipo === 'info') {
          <svg viewBox="0 0 24 24"><path d="M12 11v6M12 7h.01" /></svg>
        } @else {
          <svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7" /></svg>
        }
      </span>
      <div class="texto">
        <strong>{{ aviso.titulo }}</strong>
        @if (aviso.detalle) {
          <span>{{ aviso.detalle }}</span>
        }
      </div>
      <button
        type="button"
        class="cerrar"
        aria-label="Cerrar aviso"
        (click)="servicio.cerrar(aviso.id)"
      >
        ×
      </button>
    </div>
  }
</div>
