@if (totalPaginas() > 1) {
  <nav class="paginacion" [attr.aria-label]="etiqueta()">
    <button type="button" [disabled]="pagina() === 0" (click)="irA(pagina() - 1)">Anterior</button>
    <span aria-live="polite">Página {{ pagina() + 1 }} de {{ totalPaginas() }}</span>
    <button
      type="button"
      [disabled]="pagina() + 1 >= totalPaginas()"
      (click)="irA(pagina() + 1)"
    >
      Siguiente
    </button>
  </nav>
}
