<div class="contenedor">
  <ng-content />
  <button
    type="button"
    class="ver"
    (click)="alternar()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [attr.aria-pressed]="visible()"
  >
    @if (visible()) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3l18 18" />
        <path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c5 0 8.7 3.7 10 7a12.7 12.7 0 0 1-3.2 4.4" />
        <path d="M6.6 6.6A12.6 12.6 0 0 0 2 12c1.3 3.3 5 7 10 7a10.6 10.6 0 0 0 5.4-1.4" />
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12c1.3-3.3 5-7 10-7s8.7 3.7 10 7c-1.3 3.3-5 7-10 7s-8.7-3.7-10-7z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
