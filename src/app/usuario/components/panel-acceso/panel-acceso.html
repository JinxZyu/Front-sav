<div class="tarjeta" [class.desde-izquierda]="modo() === 'login'">
  @if (modo() !== 'verificar') {
    <nav class="pestanas" [class.en-registro]="modo() === 'registro'" aria-label="Acceso">
      <span class="indicador"></span>
      <a routerLink="/usuario/login" [class.activa]="modo() === 'login'">Iniciar sesión</a>
      <a routerLink="/usuario/registro" [class.activa]="modo() === 'registro'">Crear cuenta</a>
    </nav>
  }
  <router-outlet />
</div>
