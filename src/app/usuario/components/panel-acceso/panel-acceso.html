<div class="tarjeta">
  @if (modo() === 'login' || modo() === 'registro') {
    <nav class="pestanas" [class.en-registro]="modo() === 'registro'" aria-label="Acceso">
      <span class="indicador"></span>
      <a routerLink="/usuario/login" class="pestana-login" [class.activa]="modo() === 'login'">Iniciar sesión</a>
      <a routerLink="/usuario/registro" class="pestana-registro" [class.activa]="modo() === 'registro'">Crear cuenta</a>
    </nav>
  }
  <div class="contenido">
    <router-outlet />
  </div>
</div>
