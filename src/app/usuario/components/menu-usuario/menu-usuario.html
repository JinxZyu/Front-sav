<button
  #disparador
  type="button"
  class="disparador"
  (click)="alternar()"
  aria-haspopup="menu"
  [attr.aria-expanded]="abierto()"
  [attr.aria-label]="'Menú de ' + nombre()"
>
  <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
  <span class="nombre-corto" aria-hidden="true">{{ primerNombre() }}</span>
  <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
</button>

@if (abierto()) {
  <div class="panel" role="menu" [attr.aria-label]="'Opciones de ' + nombre()">
    <div class="identidad">
      <span class="avatar grande" aria-hidden="true">{{ iniciales() }}</span>
      <div class="datos">
        <p class="nombre">{{ nombre() }}</p>
        <p class="correo">{{ sesion.correo() }}</p>
        <span class="rol">{{ nombreRol() }}</span>
      </div>
    </div>
    <button type="button" role="menuitem" class="opcion salir" (click)="cerrarSesion()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      Cerrar sesión
    </button>
  </div>
}
