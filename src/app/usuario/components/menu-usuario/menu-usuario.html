<button
  #disparador
  type="button"
  class="disparador"
  (click)="alternar()"
  aria-haspopup="menu"
  [attr.aria-expanded]="abierto()"
  [attr.aria-label]="nombre() ? 'Menú de ' + nombre() : 'Menú de usuario'"
  [attr.aria-busy]="cargando()"
>
  <span class="avatar" [class.cargando]="cargando()" aria-hidden="true">{{ iniciales() }}</span>
  @if (cargando()) {
    <span class="nombre-corto vacio" aria-hidden="true"></span>
  } @else {
    <span class="nombre-corto" aria-hidden="true">{{ primerNombre() }}</span>
  }
  <svg class="flecha" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
</button>

@if (abierto()) {
  <div class="panel" role="menu" [attr.aria-label]="'Opciones de ' + nombre()">
    <div class="identidad">
      <span class="avatar grande" aria-hidden="true">{{ iniciales() }}</span>
      <div class="datos">
        <p class="nombre">{{ nombre() }}</p>
        <p class="correo">{{ sesion.correo() }}</p>
        <span class="rol">{{ nombreRol() }}</span>
      </div>
    </div>
    <a role="menuitem" class="opcion" routerLink="/usuario/mi-cuenta" (click)="cerrar()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
      Mi cuenta
    </a>
    @if (sesion.tieneRol('HUESPED')) {
      <a role="menuitem" class="opcion" routerLink="/reservas" (click)="cerrar()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        Mis reservas
      </a>
    }
    @if (sesion.tieneRol('ANFITRION')) {
      <a role="menuitem" class="opcion" routerLink="/reservas/alojamientos" (click)="cerrar()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" /><path d="M3 10h18M8 3v4M16 3v4" /></svg>
        Reservas recibidas
      </a>
      <a role="menuitem" class="opcion" routerLink="/alojamientos/nuevo" (click)="cerrar()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7" /><path d="M5 10v10h14V10" /><path d="M12 13v5" /><path d="M9.5 15.5h5" /></svg>
        Publicar alojamiento
      </a>
    }
    @if (sesion.tieneRol('ADMINISTRADOR')) {
      <a role="menuitem" class="opcion" routerLink="/administracion" (click)="cerrar()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" /><path d="M2.5 20a6.5 6.5 0 0 1 13 0" /><path d="M16 4.5a3.5 3.5 0 0 1 0 7" /><path d="M18 14a6.5 6.5 0 0 1 3.5 6" /></svg>
        Administración
      </a>
    }
    <button type="button" role="menuitem" class="opcion salir" (click)="cerrarSesion()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
        <path d="m16 17 5-5-5-5" />
        <path d="M21 12H9" />
      </svg>
      Cerrar sesión
    </button>
  </div>
}
